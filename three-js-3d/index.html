<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Three.js 3D Animation</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
      user-select: none;
      -webkit-user-select: none;
    }
    #hero-3d-canvas-container {
      position: absolute;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      cursor: grab;
    }
    #hero-3d-canvas-container:active {
      cursor: grabbing;
    }
  </style>
</head>
<body>
  <div id="hero-3d-canvas-container"></div>

  <!-- Three.js Library & 3D Animation Script -->
  <script src="js/three.min.js"></script>
  <script src="js/hero-tower.js"></script>
</body>
</html>
